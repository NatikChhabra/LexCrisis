name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  graders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Grader invariants
        run: python tests/test_grader_invariants.py
